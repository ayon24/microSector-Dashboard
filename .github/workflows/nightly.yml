name: Daily update

on:
  schedule:
    # 15:00 IST on weekdays, then two backups. GitHub queues scheduled runs on shared capacity and
    # drops or delays them under load (worst on the hour and half hour), so the primary time is
    # off-peak and the backups do nothing once the day's snapshot has been published.
    - cron: "27 9 * * 1-5"    # 14:57 IST - primary
    - cron: "53 9 * * 1-5"    # 15:23 IST - backup
    - cron: "23 10 * * 1-5"   # 15:53 IST - backup
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "taxonomy/**", "pipeline/**", ".github/workflows/nightly.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.commit.outputs.changed == 'true' || github.event_name != 'schedule' }}
    steps:
      - uses: actions/checkout@v7

      # A backup run has nothing to do once today's data is already committed.
      - name: Is today's data already published?
        id: state
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime, json, pathlib, zoneinfo
          today = datetime.datetime.now(zoneinfo.ZoneInfo("Asia/Kolkata")).date().isoformat()
          f = pathlib.Path("data/fetch_meta.json")
          meta = json.loads(f.read_text()) if f.exists() else {}
          done = meta.get("latest_date") == today
          print(f"done={'true' if done else 'false'}")
          print(f"latest={meta.get('latest_date')} today={today}")
          PY
          cat "$GITHUB_OUTPUT"

      - name: Skip (already up to date)
        if: github.event_name == 'schedule' && steps.state.outputs.done == 'true'
        run: echo "Today's prices are already committed; nothing to do."

      - uses: actions/setup-python@v7
        if: ${{ github.event_name != 'schedule' || steps.state.outputs.done != 'true' }}
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: ${{ github.event_name != 'schedule' || steps.state.outputs.done != 'true' }}

      - name: Fetch, validate, build, export
        if: ${{ github.event_name != 'schedule' || steps.state.outputs.done != 'true' }}
        run: python -m pipeline.run_all

      - name: Commit new data
        id: commit
        if: ${{ github.event_name != 'schedule' || steps.state.outputs.done != 'true' }}
        run: |
          git add data/prices.parquet data/validation_report.json data/fetch_meta.json site/data
          if git diff --cached --quiet; then
            echo "No new prices (NSE holiday or data not yet published)."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Data update $(python -c 'import json;print(json.load(open("site/data/summary.json"))["as_of"])')"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload site
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: update
    if: needs.update.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
