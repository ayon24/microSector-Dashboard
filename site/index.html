<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Micro-Sector Dashboard</title>
  <meta name="description" content="Equal-weight micro-sector indices for Indian equities, compared with the NIFTY 500. Updated after every NSE session.">
  <link rel="stylesheet" href="style.css">
  <script>
    try { const t = localStorage.getItem("msd-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@5.0.8/dist/lightweight-charts.standalone.production.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>Micro-Sector Dashboard</h1>
      <p class="sub" id="asof">Loading…</p>
    </div>
    <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/></svg>
    </button>
  </header>

  <section class="controls" aria-label="Filters">
    <div class="seg" role="group" aria-label="View" id="view-seg">
      <button type="button" data-view="grid">Grid</button>
      <button type="button" data-view="table">Table</button>
    </div>
    <div class="seg" role="group" aria-label="Timeframe" id="tf-seg"></div>
    <div class="seg" role="group" aria-label="Scale" id="scale-seg">
      <button type="button" data-scale="linear">Linear</button>
      <button type="button" data-scale="log">Log</button>
    </div>
    <input type="search" id="search" placeholder="Search micro sector…" aria-label="Search micro sector">
    <select id="broad" aria-label="Broad sector"><option value="">All sectors</option></select>
    <select id="show" aria-label="Show">
      <option value="all">All</option>
      <option value="top">Top 20</option>
      <option value="bottom">Bottom 20</option>
    </select>
    <select id="sort" aria-label="Sort">
      <option value="ret-desc">Return: high → low</option>
      <option value="ret-asc">Return: low → high</option>
      <option value="name">Name</option>
    </select>
  </section>

  <div class="legend" id="legend">
    <span class="key"><i class="swatch idx"></i>Micro-sector index</span>
    <span class="key"><i class="swatch bench"></i><span id="bench-name">NIFTY 500</span></span>
    <span class="note" id="chart-note"></span>
  </div>

  <main>
    <div id="grid" class="grid" aria-live="polite"></div>
    <div id="table-wrap" class="table-wrap" hidden>
      <table id="table" class="data"></table>
    </div>
    <p class="empty" id="empty" hidden>No micro sectors match.</p>
    <p class="footnote" id="not-indexed"></p>
  </main>

  <dialog id="detail" aria-labelledby="detail-title">
    <div class="detail-head">
      <div>
        <h2 id="detail-title"></h2>
        <p class="sub" id="detail-sub"></p>
      </div>
      <button class="icon-btn" type="button" id="detail-close" aria-label="Close">✕</button>
    </div>
    <div class="detail-readout" id="detail-readout"></div>
    <div class="detail-chart" id="detail-chart"></div>
    <div class="table-wrap"><table class="data" id="detail-table"></table></div>
  </dialog>

  <footer>
    <p id="method"></p>
    <p>Prices: Yahoo Finance (adjusted), cross-checked against NSE bhavcopy. Not investment advice.
      Charts by <a href="https://www.tradingview.com/" target="_blank" rel="noopener">TradingView</a> Lightweight Charts.</p>
  </footer>
</body>
</html>
